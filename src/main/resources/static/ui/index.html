<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Shorten a URL with an optional custom path.">
    <title>JUST - URL Shortener</title>
    <meta property="og:title" content="JUST - URL Shortener">
    <meta property="og:description" content="Shorten a URL with an optional custom path.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d95530'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Georgia,serif' font-weight='bold' text-anchor='middle' fill='white'%3EJ%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/ui/styles.css">
    <script src="/ui/app.js" defer></script>
</head>
<body>
<main class="page-shell">
    <section class="shortener-card" aria-labelledby="page-title">
        <p class="eyebrow">JUST / URL SHORTENER</p>
        <h1 id="page-title">Make the long story short.</h1>
        <p class="intro">
            Paste a destination and optionally choose the ending.
        </p>

        <form id="shorten-form">
            <div class="field">
                <label for="original-url">Destination URL</label>
                <input
                        id="original-url"
                        name="url"
                        type="url"
                        inputmode="url"
                        autocomplete="url"
                        maxlength="2048"
                        placeholder="https://example.com/article"
                        required>
            </div>

            <div class="field">
                <label for="custom-path">
                    Custom path <span class="optional">optional</span>
                </label>
                <div class="path-input">
                    <span id="origin-prefix" class="origin-prefix" aria-hidden="true"></span>
                    <input
                            id="custom-path"
                            name="customPath"
                            type="text"
                            pattern="[A-Za-z0-9_\-]+"
                            maxlength="64"
                            autocomplete="off"
                            spellcheck="false"
                            placeholder="launch">
                </div>
                <p class="field-hint">Letters, numbers, hyphens, and underscores.</p>
            </div>

            <button id="shorten-button" class="primary-button" type="submit">
                Shorten URL
            </button>
        </form>

        <section id="result" class="result" hidden>
            <p class="result-label">Your short link</p>
            <a
                    id="short-url"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"></a>
            <button id="copy-button" class="copy-button" type="button">Copy</button>
        </section>

        <p id="status" class="status" role="status" aria-live="polite"></p>
        <noscript>
            <p class="status status-error">JavaScript is required to shorten URLs.</p>
        </noscript>
    </section>
</main>
</body>
</html>
