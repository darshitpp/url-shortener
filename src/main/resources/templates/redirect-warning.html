<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm redirect – JUST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d95530'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Georgia,serif' font-weight='bold' text-anchor='middle' fill='white'%3EJ%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/ui/pages.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="card">
      <span class="eyebrow">JUST / URL SHORTENER</span>
      <h1>You are leaving just.darshit.dev</h1>

      <div class="destination-info">
        <div class="destination-host" th:text="${destinationHost}">example.com</div>
        <div class="destination-url" th:text="${destination}">https://example.com/very/long/path</div>

        <div class="destination-meta">
          <div class="meta-item">
            <span class="meta-label">Scheme</span>
            <span class="meta-value" th:text="${destinationScheme}">https</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Short path</span>
            <span class="meta-value" th:text="${shortPath}">abc123</span>
          </div>
        </div>
      </div>

      <div class="warning-banner" th:if="${insecure}">
        This destination does not use HTTPS.
      </div>

      <p class="reassurance">We never redirect without your confirmation.</p>

      <form method="post" th:action="@{/resolve/{path}(path=${shortPath})}">
        <div class="actions">
          <button type="submit" class="btn btn-primary">Continue</button>
          <a href="/ui/index.html" class="btn btn-secondary">Go back</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
